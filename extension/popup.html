<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 260px;
      font-family: -apple-system, Arial, sans-serif;
      padding: 16px;
      color: #222;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 8px 0;
    }
    p {
      font-size: 13px;
      color: #555;
      line-height: 1.5;
      margin: 0 0 10px 0;
    }
    .fg-tag {
      display: inline-block;
      background: #e6f4ea;
      color: #1e6b34;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <span class="fg-tag">Active on this page</span>
  <h1>FormGuard</h1>
  <p>Checking upload fields and typed details on this page in real time. Look for the status panel in the bottom-right corner.</p>
  <p>Green = good to go. Yellow/red = something needs fixing before you submit.</p>

</html>
