<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Test Scholarship Application Form</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 480px; margin: 60px auto; }
    label { display: block; margin-top: 16px; font-weight: bold; font-size: 14px; }
    input { display: block; margin-top: 6px; padding: 8px; width: 100%; box-sizing: border-box; }
    h1 { font-size: 20px; }
    button { margin-top: 24px; padding: 10px 20px; }
  </style>
</head>
<body>
  <h1>Test Scholarship Application</h1>

  <label for="name">Full Name</label>
  <input type="text" id="name" placeholder="Enter your full name" />

  <label for="dob">Date of Birth</label>
  <input type="text" id="dob" placeholder="DD/MM/YYYY" />

  <label for="cert">Certificate Number</label>
  <input type="text" id="cert" placeholder="Enter certificate number" />

  <label for="doc">Upload ID / Certificate Scan</label>
  <input type="file" id="doc" accept="image/*,.pdf" />

  <button type="button" onclick="alert('This is a test form — submit is disabled.')">Submit Application</button>
</body>
</html>
